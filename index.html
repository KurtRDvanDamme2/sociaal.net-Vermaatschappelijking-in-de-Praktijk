<!DOCTYPE html>
<html lang="nl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Literatuuroverzicht: Vermaatschappelijking (Sociaal.Net)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hih: {
                            green: '#1E5939',
                            orange: '#E35220',
                            sand: '#F5F2EB',
                            dark: '#2C3531',
                            gray: '#555F5A'
                        }
                    },
                    fontFamily: {
                        sans: ['Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #E5E0D8;
            color: #2C3531;
        }

        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 { transform: rotateY(180deg); }

        .flip-card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            border-radius: 20px 0 20px 0;
        }

        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }

        .card-front {
            background-color: #FFFFFF;
            border-top: 6px solid #1E5939;
            border-radius: 20px 0 20px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            text-align: center;
        }

        .card-back {
            background-color: #1E5939;
            color: #FFFFFF;
            border-bottom: 6px solid #E35220;
            border-radius: 20px 0 20px 0;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: left;
            overflow-y: auto;
        }
        
        /* Categorie kleuren */
        .cat-1 .card-front { border-top-color: #E35220; }
        .cat-1 .card-back { background-color: #E35220; border-bottom-color: #1E5939; }
        
        .cat-2 .card-front { border-top-color: #0284c7; }
        .cat-2 .card-back { background-color: #0284c7; border-bottom-color: #E35220; }
        
        .cat-3 .card-front { border-top-color: #1E5939; }
        .cat-3 .card-back { background-color: #1E5939; border-bottom-color: #E35220; }
